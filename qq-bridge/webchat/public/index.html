<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12131a">
<title>鲸鱼池</title>
<style>
  :root{
    --bg:#12131a; --panel:#1a1c25; --line:#262936; --text:#e8e9ef; --dim:#8b8fa3;
    --mine:#3b6df6; --her:#2b3550; --sys:#6b6f82;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;
    height:100dvh;overflow:hidden;
  }

  /* ── 进门 ── */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px;gap:14px;z-index:20}
  #gate h1{font-size:22px;margin:0 0 2px;font-weight:600}
  #gate p{color:var(--dim);font-size:13px;margin:0 0 18px;text-align:center}
  #gate input{width:100%;max-width:320px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:16px;outline:none}
  #gate input:focus{border-color:#3b6df6}
  #gate button{width:100%;max-width:320px;padding:13px;border-radius:12px;border:0;
    background:var(--mine);color:#fff;font-size:16px;font-weight:600}
  #gate .err{color:#ff7a7a;font-size:13px;min-height:18px}

  /* ── 头部 ── */
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));
    border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  header .t{font-weight:600;font-size:16px}
  header .s{color:var(--dim);font-size:12px}
  header .dot{width:7px;height:7px;border-radius:50%;background:#46d07a;margin-left:auto}

  /* ── 消息 ── */
  #list{flex:1;overflow-y:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:12px;
    -webkit-overflow-scrolling:touch}
  .row{display:flex;gap:8px;align-items:flex-start;max-width:100%}
  .row.mine{flex-direction:row-reverse}
  .av{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:600;color:#fff;user-select:none}
  .body{min-width:0;display:flex;flex-direction:column;gap:3px}
  .row.mine .body{align-items:flex-end}
  .name{font-size:12px;color:var(--dim);padding:0 2px}
  .bubble{background:var(--her);padding:9px 12px;border-radius:14px;border-top-left-radius:4px;
    max-width:76vw;white-space:pre-wrap;word-break:break-word}
  .row.mine .bubble{background:var(--mine);border-radius:14px;border-top-right-radius:4px}
  .her .bubble{background:linear-gradient(160deg,#2b3550,#26304a)}
  .sys{align-self:center;color:var(--sys);font-size:12px;padding:2px 0;text-align:center}
  .typing{align-self:flex-start;color:var(--dim);font-size:12.5px;padding-left:44px;height:16px}
  .bubble.media{padding:6px;background:transparent}
  .bubble img.pic{max-width:52vw;max-height:52vw;border-radius:10px;display:block}
  .bubble .cap{font-size:12px;color:var(--dim);padding:4px 4px 0}
  .bubble audio.au{width:52vw;max-width:240px;display:block;margin-top:2px}
  .typing i{display:inline-block;animation:blink 1.2s infinite}
  @keyframes blink{0%,60%{opacity:.25}61%,100%{opacity:1}}

  /* ── 输入 ── */
  footer{flex:none;border-top:1px solid var(--line);background:var(--panel);
    padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .bar{display:flex;gap:8px;align-items:flex-end}
  #box{flex:1;resize:none;border:0;border-radius:12px;background:#232633;color:var(--text);
    padding:11px 13px;font:inherit;font-size:16px;max-height:120px;outline:none;line-height:1.4}
  #send{border:0;border-radius:12px;background:var(--mine);color:#fff;padding:0 16px;height:42px;
    font-size:15px;font-weight:600}
  #send:disabled{opacity:.45}
  .mini{width:42px;height:42px;border:0;border-radius:12px;background:#232633;color:var(--text);font-size:18px}
</style>
</head>
<body>

<div id="gate">
  <h1>鲸鱼池</h1>
  <p>要邀请码才能进来</p>
  <input id="code" placeholder="邀请码" autocapitalize="characters" autocomplete="off">
  <input id="nick" placeholder="你的昵称" maxlength="16" autocomplete="off">
  <button id="go">进群</button>
  <div class="err" id="gerr"></div>
</div>

<header>
  <div>
    <div class="t" id="gtitle">鲸鱼池</div>
    <div class="s" id="gsub">连接中…</div>
  </div>
  <div class="dot"></div>
</header>

<div id="list"></div>
<footer>
  <div class="typing" id="typing"></div>
  <div class="bar">
    <button id="pick" class="mini" title="发图片/表情">＋</button>
    <textarea id="box" rows="1" placeholder="说点什么…"></textarea>
    <button id="poke" class="mini" title="拍一拍">👋</button>
    <button id="send">发送</button>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const list = $('list'), box = $('box'), sendBtn = $('send');
  const COLORS = ['#e2686f','#e0a44b','#4bb07a','#4b8fe0','#9a6fe0','#e07fa8','#5fb8c9','#c98f5f'];
  let ME = '';

  function colorOf(nick){
    let h = 0; for (const ch of nick) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function addMsg(m){
    if (m.role === 'sys') {
      const d = document.createElement('div');
      d.className = 'sys';
      d.textContent = m.text;
      list.appendChild(d);
    } else {
      const mine = m.role === 'user' && m.nick === ME;
      const row = document.createElement('div');
      row.className = 'row' + (mine ? ' mine' : '') + (m.role === 'her' ? ' her' : '');
      const av = document.createElement('div');
      av.className = 'av';
      av.style.background = colorOf(m.nick);
      av.textContent = (m.nick || '?').slice(0,1);
      const body = document.createElement('div');
      body.className = 'body';
      const nm = document.createElement('div');
      nm.className = 'name';
      nm.textContent = mine ? '我' : m.nick;
      const b = document.createElement('div');
      b.className = 'bubble';
      if (m.kind === 'image' && m.src) {
        const img = document.createElement('img');
        img.src = m.src; img.className = 'pic';
        b.appendChild(img);
        if (m.text && m.text !== '[图片]') { const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = m.text; b.appendChild(cap); }
        b.classList.add('media');
      } else if (m.kind === 'audio' && m.src) {
        b.textContent = '🎙 语音';
        b.title = m.silk ? '（QQ 的 silk 格式，浏览器可能放不了）' : '';
        const au = document.createElement('audio');
        au.controls = true; au.src = m.src; au.className = 'au';
        b.appendChild(au);
        b.classList.add('media');
      } else {
        b.textContent = m.text;
      }
      body.appendChild(nm); body.appendChild(b);
      row.appendChild(av); row.appendChild(body);
      list.appendChild(row);
    }
    list.scrollTop = list.scrollHeight;
  }

  function setTyping(on){
    $('typing').innerHTML = on ? '鲸鱼女孩正在输入<i>…</i>' : '';
  }
  function setMembers(list_){
    $('gsub').textContent = `${list_.length + 1} 个人在群里`;
  }

  async function join(){
    const code = $('code').value.trim(), nick = $('nick').value.trim();
    if (!code || !nick) { $('gerr').textContent = '两个都要填'; return; }
    $('go').disabled = true;
    try {
      const r = await fetch('/api/join', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ code, nick }),
      });
      const j = await r.json();
      if (!j.ok) { $('gerr').textContent = j.error || '进不去'; $('go').disabled = false; return; }
      ME = j.nick;
      $('gate').style.display = 'none';
      open();
    } catch (e) { $('gerr').textContent = '网络不通'; $('go').disabled = false; }
  }

  function open(){
    const es = new EventSource('/api/stream');
    es.onmessage = (ev) => {
      let d; try { d = JSON.parse(ev.data); } catch { return; }
      if (d.type === 'hello') {
        ME = d.me || ME;
        $('gtitle').textContent = d.group || '鲸鱼池';
        setMembers(d.members || []);
        (d.messages || []).forEach(addMsg);
      } else if (d.type === 'msg') {
        addMsg(d.msg);
        if (d.msg.role === 'her') setTyping(false);
      } else if (d.type === 'typing') {
        setTyping(!!d.on);
      } else if (d.type === 'members') {
        setMembers(d.list || []);
      }
    };
    es.onerror = () => { $('gsub').textContent = '连接断了，正在重连…'; };
  }

  async function say(){
    const text = box.value.trim();
    if (!text) return;
    box.value = ''; box.style.height = 'auto';
    sendBtn.disabled = true;
    try {
      await fetch('/api/say', {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ text }),
      });
    } catch {}
    sendBtn.disabled = false;
    box.focus();
  }

  $('go').  // 上传图片/表情：先传到服务端，再把这条消息当成带图的消息发出去
  const pickBtn = $('pick'), fileInput = $('file');
  pickBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    const buf = await f.arrayBuffer();
    const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': f.type || 'application/octet-stream' }, body: buf });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) { alert('传不上去：' + (j.error || r.status)); return; }
    await fetch('/api/say', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: '', mediaUrl: j.url }) });
  });

  // 拍一拍
  $('poke').addEventListener('click', async () => {
    await fetch('/api/say', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text: '（拍了拍小鲸鱼）' }) });
  });

  $('go').addEventListener('click', join);
  $('nick').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
  $('code').addEventListener('keydown', e => { if (e.key === 'Enter') $('nick').focus(); });
  sendBtn.addEventListener('click', say);
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); say(); }
  });
  box.addEventListener('input', () => {
    box.style.height = 'auto';
    box.style.height = Math.min(120, box.scrollHeight) + 'px';
  });

  // /j/<邀请码> 链接：把码填进去，只让人起个名字
  const m = location.pathname.match(/^\/j\/([A-Za-z0-9]+)$/);
  if (m) { document.getElementById('code').value = m[1].toUpperCase(); document.getElementById('nick').focus(); }

  // 已经进过门就直接连
  fetch('/api/history').then(r => r.ok ? r.json() : null).then(j => {
    if (j && j.ok) { ME = j.me; $('gate').style.display = 'none'; open(); }
  }).catch(() => {});
})();
</script>
</body>
</html>
