<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>她的家</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{color-scheme:light;
    --ink:#5b4636;--ink2:#9a8470;--glass:rgba(255,248,240,.68);--glass2:rgba(255,255,255,.55);
    --line:rgba(190,150,120,.28);--acc:#ff9eb5;--acc2:#ffb86b;--on:rgba(255,158,181,.28);
    --shadow:0 8px 28px -10px rgba(120,80,50,.35);--ease:cubic-bezier(.22,1,.36,1)}
  body.night{color-scheme:dark;
    --ink:#e9e4ff;--ink2:#9aa3cf;--glass:rgba(28,31,58,.62);--glass2:rgba(60,66,110,.4);
    --line:rgba(150,160,230,.25);--acc:#b79cff;--acc2:#ffcf8a;--on:rgba(183,156,255,.28);
    --shadow:0 8px 28px -10px rgba(0,0,20,.6)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    background:linear-gradient(#a9d8ff,#ffeede);
    font:13px/1.6 "HarmonyOS Sans SC","MiSans","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);
    transition:color .6s}
  #app{position:fixed;inset:0;opacity:0;transition:opacity 1.2s var(--ease)}
  #app.in{opacity:1}
  canvas{display:block;cursor:grab}canvas:active{cursor:grabbing}
  .panel{background:var(--glass);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    backdrop-filter:blur(14px) saturate(1.25);-webkit-backdrop-filter:blur(14px) saturate(1.25);
    transition:background .6s,border-color .6s}
  .hud{position:fixed;left:18px;top:16px;pointer-events:none;padding:10px 16px 10px 14px;display:flex;gap:11px;align-items:center;
    animation:rise .8s var(--ease) both}
  .hud .pulse{width:10px;height:10px;border-radius:50%;background:#6fd6a0;flex:none;box-shadow:0 0 0 0 rgba(111,214,160,.6);animation:ping 2.6s ease-out infinite}
  .hud .now{font-size:16px;font-weight:700;letter-spacing:.06em;line-height:1.25}
  .hud .sub{color:var(--ink2);font-size:12px}
  .hud .sub b{color:var(--ink);font-weight:600}
  .floors{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:14px;display:flex;padding:4px;border-radius:999px;
    animation:rise .8s .08s var(--ease) both}
  #sky{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#7fc3ff,#d9f1ff)}
  #stars{position:fixed;inset:0 0 38% 0;opacity:0;pointer-events:none}
  #stars .tw{position:absolute;inset:0;animation:tw 4.5s ease-in-out infinite alternate;background-image:radial-gradient(1.6px 1.6px at 8% 18%,#fff,transparent),radial-gradient(1.2px 1.2px at 17% 42%,#fff,transparent),radial-gradient(1.8px 1.8px at 29% 12%,#ffe9b8,transparent),radial-gradient(1.2px 1.2px at 41% 33%,#fff,transparent),radial-gradient(1.6px 1.6px at 53% 9%,#fff,transparent),radial-gradient(1.2px 1.2px at 64% 28%,#cfe0ff,transparent),radial-gradient(1.8px 1.8px at 76% 15%,#fff,transparent),radial-gradient(1.2px 1.2px at 86% 38%,#fff,transparent),radial-gradient(1.6px 1.6px at 93% 11%,#ffe9b8,transparent),radial-gradient(1.2px 1.2px at 35% 52%,#fff,transparent),radial-gradient(1.2px 1.2px at 70% 50%,#fff,transparent)}
  #dof{position:fixed;inset:0;pointer-events:none;opacity:0;backdrop-filter:blur(7px) saturate(1.06);-webkit-backdrop-filter:blur(7px) saturate(1.06);
    -webkit-mask-image:radial-gradient(ellipse 30% 46% at 50% 54%,transparent 58%,#000 100%);mask-image:radial-gradient(ellipse 30% 46% at 50% 54%,transparent 58%,#000 100%)}
  .clock{margin-left:6px;padding-left:14px;border-left:1px solid var(--line);text-align:center;line-height:1.2}
  #cT{font-size:20px;font-weight:700;letter-spacing:.04em;font-variant-numeric:tabular-nums}
  #cP{font-size:11.5px;color:var(--ink2)}
  @keyframes tw{from{opacity:.55}to{opacity:1}}
  .floors .slider{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;pointer-events:none;
    background:linear-gradient(120deg,var(--acc),var(--acc2));opacity:.9;transition:transform .5s var(--ease),width .5s var(--ease)}
  .floors button{position:relative;background:transparent;border:0;color:var(--ink2);font:inherit;font-size:13px;font-weight:600;
    padding:5px 18px;border-radius:999px;cursor:pointer;transition:color .3s}
  .floors button:hover{color:var(--ink)}
  .floors button.on{color:#fff;text-shadow:0 1px 2px rgba(120,60,60,.35)}
  .floors button.dot::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#6fd6a0;margin-left:6px;vertical-align:middle;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
  .warn{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:rgba(255,222,226,.92);
    border:1px solid rgba(255,140,160,.5);color:#a43b52;padding:6px 14px;border-radius:12px;font-size:12px;display:none;
    box-shadow:var(--shadow)}
  .bar{position:fixed;left:18px;bottom:16px;display:flex;gap:8px;padding:6px;border-radius:16px;animation:rise .8s .16s var(--ease) both}
  .bar button{background:transparent;border:0;color:var(--ink);border-radius:11px;padding:6px 12px;font:inherit;font-size:12.5px;
    font-weight:600;cursor:pointer;transition:background .25s,transform .25s var(--ease)}
  .bar button:hover{background:var(--on);transform:translateY(-1px)}
  .bar button:active{transform:scale(.94)}
  .bar button.quiet{color:var(--ink2);font-weight:400}
  .tip{position:fixed;right:18px;bottom:16px;font-size:11.5px;color:var(--ink2);padding:6px 12px;border-radius:12px;
    animation:rise .8s .24s var(--ease) both;pointer-events:none}
  #dbg{display:none;position:fixed;right:16px;top:64px;max-width:360px;background:rgba(20,16,30,.88);border:1px solid rgba(180,160,255,.3);
    color:#d7ccff;font:11.5px/1.6 monospace;padding:10px 12px;border-radius:12px;white-space:pre-wrap;z-index:99}
  @keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(111,214,160,.55)}70%,100%{box-shadow:0 0 0 9px rgba(111,214,160,0)}}
  @media (max-width:720px){.tip{display:none}.floors{top:70px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#app{opacity:1}}
</style></head><body>
<div id="sky"></div>
<div id="stars"><div class="tw"></div></div>
<div id="app"></div>
<div id="dof"></div>
<div class="hud panel">
  <div class="pulse"></div>
  <div>
    <div class="now" id="hPlace">—</div>
    <div class="sub"><b id="hFloor">—</b> · <b id="hDoing">—</b></div>
  </div>
  <div class="clock"><div id="cT">--:--</div><div id="cP"></div></div>
</div>
<div class="floors panel" id="floors"></div>
<div class="warn" id="warn"></div>
<div id="dbg"></div>
<div class="bar panel"><button id="bFace" title="快捷键 F">🔍 看她</button><button id="bReset">🏠 全景</button><button id="bMood">🕒 实时</button><button id="bReload" class="quiet">重新读取</button><button id="bDbg" class="quiet">诊断</button></div>
<div class="tip panel">拖动旋转 · 滚轮缩放 · 点房间聚焦 · F 看她 · T 换时间 · 1-4 切视角</div>

<script type="importmap">
{
  "imports": {
    "three": "/media/space/three.module.min.js",
    "@pixiv/three-vrm": "/media/space/vendor/three-vrm.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '/media/space/vendor/loaders/GLTFLoader.js';
import { RoomEnvironment } from '/media/space/vendor/environments/RoomEnvironment.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import { createMotion } from '/media/space/motion.js';

// 抓日志：贴图加载失败只在 console 里说一句，看不见就永远在猜。
var LOGS = [];
(function hookLog(){
  ['warn', 'error'].forEach(function (lv){
    var orig = console[lv].bind(console);
    console[lv] = function (){
      try {
        var s = Array.prototype.map.call(arguments, function (a){
          if (typeof a === 'string') return a;
          try { return a && a.message ? a.message : JSON.stringify(a); } catch (e){ return String(a); }
        }).join(' ');
        LOGS.push(lv + ': ' + s.slice(0, 200));
        if (LOGS.length > 12) LOGS.shift();
      } catch (e) {}
      orig.apply(console, arguments);
    };
  });
  addEventListener('error', function (e){ LOGS.push('✗ ' + (e.message || '脚本错误')); });
  addEventListener('unhandledrejection', function (e){
    var r = e && e.reason;
    LOGS.push('✗ promise: ' + ((r && (r.message || r)) + '').slice(0, 180));
  });
})();

var TOKEN = new URLSearchParams(location.search).get('token') || '';
var PARAMS = new URLSearchParams(location.search);
var warnEl = document.getElementById('warn');
var hPlace = document.getElementById('hPlace');
var hFloor = document.getElementById('hFloor');
var hDoing = document.getElementById('hDoing');
function warn(msg){ warnEl.textContent = msg || ''; warnEl.style.display = msg ? 'block' : 'none'; }

// 诊断面板：点左下角「诊断」按钮，或地址加 &debug=1
var dbgEl = document.getElementById('dbg');
function dbg(text){
  if (dbgEl && text) dbgEl.textContent = text;
}
function dbgToggle(){
  if (!dbgEl) return;
  var on = dbgEl.style.display === 'block';
  dbgEl.style.display = on ? 'none' : 'block';
  if (!on && !dbgEl.textContent) dbgEl.textContent = '（等模型加载完再看）';
}
if (PARAMS.get('debug') === '1' && dbgEl) dbgEl.style.display = 'block';

// 虚化层彻底关掉：镜头已经真的站到她面前，不需要再靠 CSS 模糊做景深
(function (){ var d = document.getElementById('dof'); if (d) d.style.display = 'none'; })();

// ── 渲染器与相机 ────────────────────────────────────────────────────
var app = document.getElementById('app');
var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(1.5, window.devicePixelRatio || 1));
app.appendChild(renderer.domElement);

var scene = new THREE.Scene();
var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -100, 200);
// 「看她」专用的透视镜头。正交相机把视野缩小，看着像把一张照片放大（没有近大远小）；
// 换成真透视、真站在她面前 0.6 米，才有"她就在你眼前"的立体感。42° 是接近人眼的自然视角。
var camP = new THREE.PerspectiveCamera(42, 1, 0.02, 400);
var activeCam = camera;
var faceDist = 2.2;                // 推近用，会平滑收到 faceZoom
var faceZoom = 0.72;               // 贴脸时她离镜头多远（滚轮可调 0.35~1.8）
var viewSpan = 16;                 // 正交视野宽度（世界单位），随楼层大小自适应
var lookAt = new THREE.Vector3(0, 0.6, 0);
// 轨道状态：不要每帧从 camera.position 反算角度，否则到了上下限会"卡住"，而且有累积误差。
var orbit = { theta: Math.PI / 4, phi: 0.62, radius: 22, target: new THREE.Vector3(0, 0.6, 0) };
var PHI_MIN = 0.12, PHI_MAX = 1.42;   // 0=水平看，π/2=俯视

function applyOrbit(){
  orbit.target.copy(lookAt);
  var r = orbit.radius;
  camera.position.set(
    orbit.target.x + Math.cos(orbit.theta) * r * Math.cos(orbit.phi),
    orbit.target.y + Math.sin(orbit.phi) * r,
    orbit.target.z + Math.sin(orbit.theta) * r * Math.cos(orbit.phi)
  );
  camera.lookAt(orbit.target);
}

// ── 视角运镜：全景 ⇄ 她面前 ─────────────────────────────────────────
// 正交相机没有"距离"，放大靠 viewSpan；所以运镜要同时插值 角度 + 视野宽度 + 注视点。
var camTween = null;
var faceMode = false;
var lastShadow = 0;        // 阴影节流时间戳
var lastOrbitDrag = 0;     // 用户手动转镜头的时间戳（自动对脸要避开它）
var lastRenderAt = 0;      // 渲染节流时间戳（上限 ~65fps）
var blinkWait = 1.6, blinkPhase = -1;   // 眨眼状态机（-1 = 睁着等下一次）
var faceBaseSpan = 2.4;     // 贴脸时的基准视野，慢推以它为起点

function startTween(to, dur){
  camTween = {
    t: 0,
    dur: dur || 1.5,
    from: { theta: orbit.theta, phi: orbit.phi, radius: orbit.radius, span: viewSpan, x: lookAt.x, y: lookAt.y, z: lookAt.z },
    to: to
  };
}

// 世界坐标：一楼在地面，二楼抬高 FH；花园是房子正前方（+z）的院子，房后（-z）是沙滩和大海。
var FH = 2.3, GOFF = { x: 1, z: 12.4 };
function wpos(r){
  var out = r.floor === 'out';
  return { x: r.x + (out ? GOFF.x : 0), y: r.floor === '2f' ? FH : 0, z: r.z + (out ? GOFF.z : 0) };
}
function viewRooms(id){ return id === 'all' ? DATA.rooms : DATA.rooms.filter(function (r){ return r.floor === id; }); }
function floorBounds(id){
  var rooms = viewRooms(id);
  if (!rooms.length) return null;
  var a = 1e9, b = -1e9, c = 1e9, d = -1e9;
  rooms.forEach(function (r){
    var p = wpos(r);
    a = Math.min(a, p.x - r.w / 2); b = Math.max(b, p.x + r.w / 2);
    c = Math.min(c, p.z - r.d / 2); d = Math.max(d, p.z + r.d / 2);
  });
  return { cx: (a + b) / 2, cz: (c + d) / 2, span: Math.max(b - a, d - c), y: id === '2f' ? FH : 0, x0: a, x1: b, z0: c, z1: d };
}

// 看她时到底框到哪：镜头直接怼到脸前，只框「脸 + 肩」。
// 因为摄像机离得近、视野又窄，二楼和远处的家具自然就出画了 —— 不需要藏，也不需要虚化。
var _fTop = new THREE.Vector3(), _fBot = new THREE.Vector3();
function herFrame(){
  var headY = 1.39, hipY = 0.91;
  try {
    if (idle.ok && idle.head && idle.hips){
      idle.head.getWorldPosition(_fTop);
      idle.hips.getWorldPosition(_fBot);
      if (isFinite(_fTop.y) && isFinite(_fBot.y) && _fTop.y > _fBot.y){
        headY = _fTop.y; hipY = _fBot.y;
      }
    }
  } catch (e) {}
  var h = Math.max(0.32, headY - hipY);
  // 体格越矮（坐着）视野越小；0.48 的头髋差 → 约 0.55 的取景，正好脸+肩
  return { y: headY + 0.04, span: Math.max(0.44, h * 1.18) };
}

function focusOnHer(dur){
  // 贴脸模式用的是透视镜头 camP（在 frame() 里逐帧驱动），这里只做状态切换：
  // 不启动正交运镜（那会把画面切成"放大图"），改成从 2.2 米平滑推到 faceZoom。
  camTween = null;
  faceDist = 2.2;
  faceZoom = 0.72;
  // 镜头仍然由 orbit 控制（拖动 = 绕她转，滚轮 = 拉近拉远）。
  // 起始角度取她的正前方，phi 压到接近水平。
  orbit.theta = Math.PI / 2 + (avatar.rotation.y || 0);
  orbit.phi = 0.05;
  lastOrbitDrag = 0;                 // 允许它自动绕回正脸
  // 镜头就在她面前、房间里面 —— 墙不再挡视线，所以不需要淡墙，
  // 让她背后是一面实墙当背景，比半透明看到海干净得多。
  setWallsFaded(false);
  // 先把 camP 摆到位，避免第一帧从上一个位置"闪"一下
  try {
    var hw = new THREE.Vector3();
    (idle.head || avatar).getWorldPosition(hw);
    var fr = herFrame();
    var cp0 = Math.cos(orbit.phi), sp0 = Math.sin(orbit.phi);
    camP.position.set(
      hw.x + Math.cos(orbit.theta) * 2.2 * cp0,
      fr.y + sp0 * 2.2,
      hw.z + Math.sin(orbit.theta) * 2.2 * cp0
    );
    camP.lookAt(hw.x, fr.y - 0.035, hw.z);
    camP.updateMatrixWorld();
    activeCam = camP;
  } catch (e) {}
}

function focusOverview(dur){ focusFloor(floorId, true, dur); }

// 把矮墙淡成半透明：贴脸时镜头在屋内，墙在相机背后/旁边，不该挡视线
function setWallsFaded(fade, op){
  // op 可以不传：默认 0.14（远景切楼层用），贴脸时给 0.42 —— 留一层墙当背景，
  // 既不会隔着墙看她，也不至于把整面墙看穿、直接看到海。
  var a = op === undefined ? 0.14 : op;
  group.traverse(function (o){
    if (!o.isMesh || !o.userData.isWall || !o.material) return;
    o.material.transparent = fade;
    o.material.opacity = fade ? a : 1;
    o.material.depthWrite = !fade;
    o.material.needsUpdate = true;
  });
}

function toggleView(){
  faceMode = !faceMode;
  var b = document.getElementById('bFace');
  if (b) b.textContent = faceMode ? '🏠 回全景' : '🔍 看她';
  if (faceMode) focusOnHer(); else focusOverview();
}

// ── 灯光：暖色日光 + 柔阴影；时间跟随电脑时钟，游戏式连续昼夜 ───────────
var LIGHT_BOOST = Number(PARAMS.get('light') || 1);   // ?light=0.5 调暗，?light=2 调亮
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// 阴影是这套场景最贵的一笔开销：2048² + PCFSoft + 几乎每个网格都投影，
// 而太阳只在 applyTime 里动、她也只在慢慢走动 —— 每帧重算 60 次里有 59 次白算。
// 改成手动更新，最多 10 次/秒（具体在 frame() 里节流）。
renderer.shadowMap.autoUpdate = false;
var amb = new THREE.HemisphereLight(0xfff4e6, 0xd9c2a6, 0.8 * LIGHT_BOOST);
scene.add(amb);
var sun = new THREE.DirectionalLight(0xfff0d6, 1.3 * LIGHT_BOOST);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 1;
scene.add(sun); scene.add(sun.target);
var rim = new THREE.DirectionalLight(0xbcd4ff, 0.3);
// 三个灯的「正常曝光」基准值（applyTime 每帧记一次，frame() 贴脸时按比例压暗）
var SUN_I = 1.3, AMB_I = 0.8, RIM_I = 0.3;
rim.position.set(-10, 8, -9); scene.add(rim);

// 程序化室内环境，不用下载 HDRI。
var pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
// PMREM 要预过滤一整张立方图（几十毫秒到上百毫秒），放在首帧之后再做：
// 页面能先出现，不至于白屏等环境贴图。
setTimeout(function (){
  try { scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; } catch (e) {}
}, 80);

var SUND = new THREE.Vector3(-0.3, 0.8, 0.5);
var lastUK = 1;
sun.shadow.camera.left = -26; sun.shadow.camera.right = 26; sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26; sun.shadow.camera.near = 1; sun.shadow.camera.far = 110; sun.shadow.camera.updateProjectionMatrix();
var SEA = null;

// 夜里的灯：只留 6 盏真实点光，跟着镜头焦点换到最近的灯（数量恒定，不会重编译着色器）；
// 其余的灯只靠自发光 + 光晕，一样好看、几乎不花算力。
var POOL = [], LAMPC = [], POOL_T = 0;
(function (){
  for (var i = 0; i < 6; i++){
    var pl = new THREE.PointLight(0xffc27a, 0, 6, 2); scene.add(pl);
    POOL.push({ l: pl, cand: null, want: null, k: 0 });
  }
})();
var GLOW_MAT = (function (){
  var c = document.createElement('canvas'); c.width = c.height = 64;
  var g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,214,150,.95)'); gr.addColorStop(0.35, 'rgba(255,190,110,.35)'); gr.addColorStop(1, 'rgba(255,170,90,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return new THREE.SpriteMaterial({ map: t, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
})();

// ── 时间：真实时钟。关键帧（时, 天顶色, 地平色, 环境光, 强度, 日/月光, 强度, 夜晚程度）──
var KF = [

  root.position.y -= box.min.y;
}

// ── 程序化待机 ──────────────────────────────────────────────────────
// VRM 只带物理（头发/裙子），身体本身没有任何动画 —— 不写这段她就一直僵着。
// 关键：必须在**原始值上叠加**，不能直接赋值。髋骨原本的 y 是站立高度（约 1m），
// 直接写成 hips.position.y = 0.01 等于把她整个人往下拽 1 米 —— 就卡进地板了。
var idle = { ok: false, base: null };
var prevPos = new THREE.Vector3();   // 上一帧位置，用来算实际速度

function setupIdle(v){
  try {
    var h = v.humanoid;
    if (!h || typeof h.getNormalizedBoneNode !== 'function') return;
    idle.hips = h.getNormalizedBoneNode('hips');
    idle.spine = h.getNormalizedBoneNode('spine');
    idle.chest = h.getNormalizedBoneNode('chest');
    idle.head = h.getNormalizedBoneNode('head');
    idle.lua = h.getNormalizedBoneNode('leftUpperArm');
    idle.rua = h.getNormalizedBoneNode('rightUpperArm');
    idle.ok = !!(idle.hips && idle.spine);
    if (!idle.ok) return;
    idle.base = {
      hipsY: idle.hips.position.y,
      hipsZ: idle.hips.position.z,
      hipsRZ: idle.hips.rotation.z,
      spineX: idle.spine.rotation.x,
      chestX: idle.chest ? idle.chest.rotation.x : 0,
      headX: idle.head ? idle.head.rotation.x : 0,
      headY: idle.head ? idle.head.rotation.y : 0,
      luaZ: idle.lua ? idle.lua.rotation.z : 0,
      ruaZ: idle.rua ? idle.rua.rotation.z : 0
    };
    console.log('[space] idle 已绑定，髋原始高度 =', idle.base.hipsY.toFixed(3));
    setupLegs(v);
  } catch (e) {
    console.warn('[space] idle 绑定异常', e);
  }
}

function updateIdle(t){
  if (!idle.ok || !idle.base) return;
  var b = idle.base;
  var breath = Math.sin(t * 1.15);
  var sway = Math.sin(t * 0.42);
  var look = Math.sin(t * 0.23);
  // 全部是 base + 偏移，绝不覆盖
  idle.hips.position.y = b.hipsY + breath * 0.008;
  idle.hips.rotation.z = b.hipsRZ + sway * 0.020;
  idle.spine.rotation.x = b.spineX + breath * 0.012;
  if (idle.chest) idle.chest.rotation.x = b.chestX + Math.sin(t * 1.15 + 0.6) * 0.014;
  if (idle.head) {
    idle.head.rotation.y = b.headY + look * 0.15;
    idle.head.rotation.x = b.headX + Math.sin(t * 0.31) * 0.035;
  }
  // 手臂放下：她的静止姿态是 **T-pose**（双臂平举），不放下来就一直张着。
  // 实测（VRM 骨骼 FK）：左臂 z=-1.25 / 右臂 z=+1.25 时手正好垂在大腿外侧。
  // 原来这里是 +0.10 / -0.10 —— 那个方向是**往上抬**，等于让手臂张得更开，
  // 这就是「手臂僵硬」的真正原因。&arm=N 仍然可以现场微调（正数更贴身）。
  var armDrop = Number(PARAMS.get('arm') || 0);
  if (idle.lua) idle.lua.rotation.z = b.luaZ - 1.25 - armDrop + breath * 0.010;
  if (idle.rua) idle.rua.rotation.z = b.ruaZ + 1.25 + armDrop - breath * 0.010;
  // 腿回到站立（如果刚从走路切回来）
  if (idle.lul) idle.lul.rotation.x = (idle.base.lulX || 0);
  if (idle.rul) idle.rul.rotation.x = (idle.base.rulX || 0);
  if (idle.lll) idle.lll.rotation.x = (idle.base.lllX || 0);
  if (idle.rll) idle.rll.rotation.x = (idle.base.rllX || 0);
}

// ── 程序化走路 ──────────────────────────────────────────────────────
// 没有动画文件，就用正弦波驱动大腿/小腿/手臂。不是专业动作，但"腿在迈"和"滑行"
// 是两种观感。步频跟着移动速度走，停下会自动回到 idle。
var walkPhase = 0;

function setupLegs(v){
  try {
    var h = v.humanoid;
    var g = function (name) { return h.getNormalizedBoneNode(name); };
    idle.lul = g('leftUpperLeg');
    idle.rul = g('rightUpperLeg');
    idle.lll = g('leftLowerLeg');
    idle.rll = g('rightLowerLeg');
    idle.lua = idle.lua || g('leftUpperArm');
    idle.rua = idle.rua || g('rightUpperArm');
    idle.lal = g('leftLowerArm');
    idle.ral = g('rightLowerArm');
    // 记录腿和手臂的原始角度
    idle.base.lulX = idle.lul ? idle.lul.rotation.x : 0;
    idle.base.rulX = idle.rul ? idle.rul.rotation.x : 0;
    idle.base.lllX = idle.lll ? idle.lll.rotation.x : 0;
    idle.base.rllX = idle.rll ? idle.rll.rotation.x : 0;
    idle.base.luaX = idle.lua ? idle.lua.rotation.x : 0;
    idle.base.ruaX = idle.rua ? idle.rua.rotation.x : 0;
    idle.base.lalX = idle.lal ? idle.lal.rotation.x : 0;
    idle.base.ralX = idle.ral ? idle.ral.rotation.x : 0;
  } catch (e) { console.warn('[space] 腿骨绑定失败', e); }
}

function updateWalk(dt, speed){
  if (!idle.ok || !idle.base) return;
  var b = idle.base;
  // 步频跟着速度走；速度是每秒移动的米数
  walkPhase += dt * Math.min(9, 4.2 + speed * 2.2);
  var s = Math.sin(walkPhase);
  var c = Math.cos(walkPhase);
  var amp = Math.min(0.62, 0.28 + speed * 0.10);

  if (idle.lul) idle.lul.rotation.x = b.lulX + s * amp;
  if (idle.rul) idle.rul.rotation.x = b.rulX - s * amp;
  // 膝盖只往后弯：正弦半波，避免小腿往前折
  if (idle.lll) idle.lll.rotation.x = b.lllX + Math.max(0, -s) * amp * 1.15;
  if (idle.rll) idle.rll.rotation.x = b.rllX + Math.max(0, s) * amp * 1.15;
  // 手臂：先把手臂放下来（z），再用 y 前后摆。
  // 绕 x 转是绕「手臂长轴」自转 —— 手的位置根本不变，原来那几行等于白写。
  if (idle.lua) { idle.lua.rotation.z = -1.25 + b.luaZ; idle.lua.rotation.y = -s * amp * 0.55; }
  if (idle.rua) { idle.rua.rotation.z = 1.25 + b.ruaZ; idle.rua.rotation.y = s * amp * 0.55; }
  if (idle.lal) idle.lal.rotation.y = -Math.max(0, -s) * 0.20;
  if (idle.ral) idle.ral.rotation.y = Math.max(0, s) * 0.20;
  // 走路时上身轻微上下 + 侧倾，比纯腿摆更像人
  if (idle.hips) {
    idle.hips.position.y = b.hipsY + Math.abs(s) * 0.022 - 0.011;
    idle.hips.rotation.z = b.hipsRZ + c * 0.035;
  }
  if (idle.spine) idle.spine.rotation.x = b.spineX + 0.03;
}

// 画面取样：把当前帧缩到 64x40 读像素，直接报"看到的颜色"。
// 贴图缺失/被光冲爆/颜色空间错，都能量化出来，不用靠肉眼猜。
function frameStats(){
  try {
    renderer.render(scene, activeCam);
    var c = document.createElement('canvas');
    c.width = 64; c.height = 40;
    var g = c.getContext('2d');
    g.drawImage(renderer.domElement, 0, 0, 64, 40);
    var d = g.getImageData(0, 0, 64, 40).data;
    var n = 64 * 40, r = 0, gg = 0, b = 0, white = 0, hist = new Map();
    for (var i = 0; i < n; i++){
      var o = i * 4, R = d[o], G = d[o + 1], B = d[o + 2];
      r += R; gg += G; b += B;
      if (R > 232 && G > 232 && B > 232) white++;
      var k = ((R >> 5) << 6) | ((G >> 5) << 3) | (B >> 5);
      hist.set(k, (hist.get(k) || 0) + 1);
    }
    var top = Array.from(hist.entries()).sort(function (x, y){ return y[1] - x[1]; }).slice(0, 4).map(function (e){
      var k = e[0];
      var R = ((k >> 6) & 7) * 32 + 16, G = ((k >> 3) & 7) * 32 + 16, B = (k & 7) * 32 + 16;
      var hx = function (x){ return ('0' + x.toString(16)).slice(-2); };
      return '#' + hx(R) + hx(G) + hx(B) + ':' + (e[1] / n * 100).toFixed(0) + '%';
    }).join(' ');
    return '画面平均 rgb(' + (r / n | 0) + ',' + (gg / n | 0) + ',' + (b / n | 0) + ') 纯白 ' + (white / n * 100).toFixed(1) + '%\n  主色 ' + top;
  } catch (e) { return '画面取样失败: ' + e.message; }
}

// ── 贴图探针：证明浏览器到底能不能解码 blob:/data: 图片 ──────────────
// GLTFLoader 把内嵌贴图做成 blob URL 再交给 <img>；页面 CSP 若没放行 blob:，
// 图片全被静默拦掉，材质就没有 map —— 看起来就是"白模"。
var PROBE = '（还没跑完）';
(function textureProbe(){
  var PNG = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
  var res = [];
  function toBlob(){
    var bin = atob(PNG), a = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], { type: 'image/png' });
  }
  var steps = [];
  steps.push(function (done){
    var im = new Image();
    var fin = false, t = setTimeout(function (){ if (!fin){ fin = true; res.push('data-URL=超时'); done(); } }, 2000);
    im.onload = function (){ if (fin) return; fin = true; clearTimeout(t); res.push('data-URL=OK ' + im.width + 'x' + im.height); done(); };
    im.onerror = function (){ if (fin) return; fin = true; clearTimeout(t); res.push('data-URL=被拦或解码失败'); done(); };
    im.src = 'data:image/png;base64,' + PNG;
  });
  steps.push(function (done){
    var im = new Image();
    var fin = false, t = setTimeout(function (){ if (!fin){ fin = true; res.push('blob-URL=超时'); done(); } }, 2000);
    im.onload = function (){ if (fin) return; fin = true; clearTimeout(t); res.push('blob-URL=OK ' + im.width + 'x' + im.height); done(); };
    im.onerror = function (){ if (fin) return; fin = true; clearTimeout(t); res.push('blob-URL=被拦或解码失败'); done(); };
    im.src = URL.createObjectURL(toBlob());
  });
  steps.push(function (done){
    if (!window.createImageBitmap){ res.push('createImageBitmap=没有'); done(); return; }
    var fin = false, t = setTimeout(function (){ if (!fin){ fin = true; res.push('createImageBitmap=超时'); done(); } }, 2000);
    createImageBitmap(toBlob()).then(function (b){
      if (fin) return; fin = true; clearTimeout(t); res.push('createImageBitmap=OK ' + b.width + 'x' + b.height); done();
    }, function (e){
      if (fin) return; fin = true; clearTimeout(t); res.push('createImageBitmap=失败 ' + ((e && e.name) || '')); done();
    });
  });
  (function next(i){
    if (i >= steps.length){ PROBE = res.join(' | '); return; }
    steps[i](function (){ next(i + 1); });
  })(0);
})();

function debugInfo(v, ver){
  try {
    var lines = [];
    lines.push('贴图探针 ' + PROBE);
    lines.push('tone=' + renderer.toneMapping + ' outCS=' + renderer.outputColorSpace + ' light=' + LIGHT_BOOST);
    lines.push(frameStats());
    lines.push('VRM 版本 ' + ver + ' | rotation.y = ' + v.scene.rotation.y.toFixed(2));
    lines.push('idle.ok = ' + idle.ok + (idle.base ? ' | 髋 y = ' + idle.base.hipsY.toFixed(3) : ''));
    if (idle.lua) lines.push('左臂 rotation.z = ' + idle.lua.rotation.z.toFixed(3));
    if (idle.head) lines.push('头骨骼: 有');
    else lines.push('头骨骼: 没有');
    var meshes = 0, mats = [];
    v.scene.traverse(function (o){
      if (!o.isMesh) return;
      meshes++;
      var arr = Array.isArray(o.material) ? o.material : [o.material];
      arr.forEach(function (m){
        if (!m) return;
        var im = m.map && m.map.image;
        var mi = m.map ? ('map=Y ' + (im ? (im.width + 'x' + im.height) : '图像没加载') + ' ' + (m.map.colorSpace || '-')) : 'map=N';
        mats.push((m.name || m.type).slice(0, 16) + ' ' + mi + ' color=' + (m.color ? m.color.getHexString() : '?'));
      });
    });
    lines.push('网格 ' + meshes + ' 个，材质 ' + mats.length + ' 个');
    mats.slice(0, 6).forEach(function (s){ lines.push('  ' + s); });
    if (mats.length > 6) lines.push('  …共 ' + mats.length);
    if (LOGS.length){
      lines.push('— 浏览器日志 —');
      LOGS.slice(-8).forEach(function (s){ lines.push(s); });
    }
    if (motion) { try { lines.push(motion.info()); } catch (e) {} }
    dbg(lines.join('\n'));
  } catch (e) { dbg('诊断失败: ' + e.message); }
}

// ── 头特写取样（&probe=2）：把屋子藏起来、背景刷成洋红，只留她，
// 然后数像素回答「贴图到底上没上」。洋红是天然抠像色，一眼一个准。
function probeHead(){
  try {
    if (!vrm) { dbg('还没加载完'); return; }
    group.visible = false;
    scene.background = new THREE.Color(0xff00ff);
    var hp = new THREE.Vector3();
    (idle.head || vrm.scene).getWorldPosition(hp);
    viewSpan = 0.5;
    lookAt.set(hp.x, hp.y, hp.z);
    orbit.theta = 0; orbit.phi = 0.08; orbit.radius = 6;
    applyOrbit(); resize();
    renderer.render(scene, activeCam);
    var c = document.createElement('canvas');
    c.width = 96; c.height = 96;
    var g = c.getContext('2d');
    g.drawImage(renderer.domElement, 0, 0, 96, 96);
    var d = g.getImageData(0, 0, 96, 96).data;
    var n = 96 * 96, cnt = 0, r = 0, gg = 0, b = 0, blue = 0, white = 0, skin = 0;
    for (var i = 0; i < n; i++){
      var o = i * 4, R = d[o], G = d[o + 1], B = d[o + 2];
      if (R > 200 && G < 80 && B > 200) continue;   // 洋红背景，跳过
      cnt++; r += R; gg += G; b += B;
      if (B > R + 25 && B > 90) blue++;             // 蓝紫：头发/眉毛
      if (R > 232 && G > 232 && B > 232) white++;   // 全白：贴图丢了或被光冲爆
      if (R > 190 && G > 150 && B > 130 && R > B) skin++;  // 肤色 #ffeedd 一族
    }
    if (!cnt) { dbg('头特写取样：一帧里没找到她'); return; }
    dbg('头特写取样\n模型占画面 ' + (cnt / n * 100).toFixed(1) + '%\n'
      + '平均 rgb(' + (r / cnt | 0) + ',' + (gg / cnt | 0) + ',' + (b / cnt | 0) + ')\n'
      + '蓝 ' + (blue / cnt * 100).toFixed(1) + '%  近白 ' + (white / cnt * 100).toFixed(1) + '%  肤色 ' + (skin / cnt * 100).toFixed(1) + '%');
  } catch (e) { dbg('特写取样失败: ' + e.message); }
}

function loadModel(){
  var loader = new GLTFLoader();
  loader.register(function (parser){ return new VRMLoaderPlugin(parser); });
  loader.load(MODEL_FILE, function (gltf){
    try {
      var v = gltf.userData.vrm;
      if (v){
        // VRM：自带骨骼、表情、头发物理
        if (VRMUtils && VRMUtils.removeUnnecessaryVertices) VRMUtils.removeUnnecessaryVertices(gltf.scene);
        if (VRMUtils && VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene);
        v.scene.traverse(function (o){ if (o.isMesh) o.frustumCulled = false; });
        // 朝向：VRM 1.0 面朝 +Z（正对镜头），VRM 0.x 面朝 -Z 才需要转 180°。
        // 版本号在 v.meta.metaVersion 上，不是 v.metaVersion。
        // 如果还是背对，地址后加 &flip=1 强制翻面（有些模型不遵守规范）。
        var ver = String((v.meta && v.meta.metaVersion) || '0');
        var baseRot = ver === '1' ? 0 : Math.PI;
        v.scene.rotation.y = PARAMS.get('flip') === '1' ? baseRot + Math.PI : baseRot;
        console.log('[space] VRM 版本', ver, '→ rotation.y =', v.scene.rotation.y, '| flip =', PARAMS.get('flip'));
        fitModel(v.scene);
        v.scene.traverse(function (o){ if (o.isMesh){ o.castShadow = true; } });
        avatar.add(v.scene);
        vrm = v;
        setupIdle(v);
        // 动作系统：坐 / 看书 / 玩手机 / 泡水。失败不影响画面，只是她还站着。
        try {
          motion = createMotion({
            THREE: THREE, vrm: v, avatar: avatar, idle: idle, renderer: renderer, params: PARAMS,
            updateIdle: updateIdle, updateWalk: updateWalk,
            setTarget: function (x, z){ targetPos.set(x, 0, z); },
            wpos: wpos, DATA: DATA
          });
          motion.setState(lastState);
        } catch (e) { console.warn('[space] 动作系统没起来', e); }
        // 诊断要额外渲染两帧 + 两次 getImageData（GPU 强制同步），
        // 平时别跑 —— 只在 &debug=1 时才做。
        if (PARAMS.get('debug') === '1') debugInfo(v, ver);
        if (PARAMS.get('posetest') === '1') setTimeout(function (){ try { if (motion) dbg(motion.testAll()); } catch (e) { dbg('姿势测试失败: ' + e.message); } }, 900);
        // 首帧时她还没被放到房间里，画面取样会取到空场景；等一拍再看一次。
        setTimeout(function (){ try { if (PARAMS.get('debug') === '1') debugInfo(v, ver); } catch (e) {} }, 1500);
        if (PARAMS.get('probe') === '2') setTimeout(probeHead, 2600);
      } else {
        // 普通 glb（Tripo 这类）：只有网格，没骨骼
        gltf.scene.traverse(function (o){
          if (!o.isMesh) return;
          o.frustumCulled = false;
          // Tripo 默认 metallicFactor=1，她不是金属件；不改的话整张脸会被"金属反射"吃掉，
          // 看起来就是白模。顺手把粗糙度抬一点，避免塑料感。
          var mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach(function (m){
            if (!m) return;
            if ('metalness' in m) m.metalness = 0.0;
            if ('roughness' in m && m.roughness > 0.85) m.roughness = 0.7;
            if ('envMapIntensity' in m) m.envMapIntensity = 1.1;
            m.needsUpdate = true;
          });
        });
        gltf.scene.rotation.y = Math.PI;
        fitModel(gltf.scene);
        avatar.add(gltf.scene);
      }
      vrmReady = true;
      body.visible = false; head.visible = false; hair.visible = false; tail.visible = false;
      warn('');
      console.log('[space] 模型已加载' + (v ? '（VRM）' : '（glb）'));
    } catch (e) {
      warn('模型处理失败：' + (e && e.message ? e.message : e));
    }
  }, function (p){
    if (p && p.total) hDoing.textContent = '模型加载中 ' + Math.round(p.loaded / p.total * 100) + '%';
    else if (p) hDoing.textContent = '模型加载中 ' + Math.round(p.loaded / 1024 / 1024) + 'MB';
  }, function (err){
    // 精简版万一加载失败 → 自动退回原版，只退一次，绝不白屏
    if (MODEL_FILE !== MODEL_FULL){
      console.warn('[space] 精简模型加载失败，退回原版', err);
      MODEL_FILE = MODEL_FULL;
      loadModel();
      return;
    }
    warn('模型加载失败（占位小人继续用）：' + (err && err.message ? err.message : err));
  });
}

// ── 她手上那本书 ─────────────────────────────────────────────────────
// 书名来自《读书》插件（/api/space/state 的 book 字段）；这里只画一本实体书，
// 位置每帧贴着她的胸口，所以走到哪个房间它都跟着——「被她带着」。
var handBook = null;
function ensureHandBook(){
  if (handBook) return handBook;
  var g = new THREE.Group();
  var paper = new THREE.MeshStandardMaterial({ color: 0xf2e8d8, roughness: 0.95 });
  var cover = new THREE.MeshStandardMaterial({ color: 0x7b4f36, roughness: 0.7 });
  var pages = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.022, 0.26), paper);
  var back = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.007, 0.27), cover);
  back.position.y = -0.013;
  var spine = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.034, 0.27), cover);
  spine.position.set(-0.097, 0, 0);
  g.add(pages, back, spine);
  g.rotation.x = -0.22;
  g.visible = false;
  g.userData.cover = cover;
  scene.add(g);
  handBook = g;
  return g;
}
function isReadingNow(st){
  if (!st) return false;
  var place = String(st.place || '');
  var doing = String((st.detail || '') + ' ' + (st.doing || ''));
  return /书房/.test(place) || /看书|读书|翻书|阅读/.test(doing);
}
/** 在书房是摊在桌上；在别处是捧在胸前——跟 motion.js 的 read / read_hold 两种姿势对应。 */
function readingMode(st){
  if (!st) return '';
  if (/书房/.test(String(st.place || ''))) return 'desk';
  var doing = String((st.detail || '') + ' ' + (st.doing || ''));
  return /看书|读书|翻书|阅读/.test(doing) ? 'hold' : '';
}
function syncHandBook(book, st){
  var g = ensureHandBook();
  // 不在看就不摆书：她平时站在卧室、客厅、花园时手上不该凭空有本书
  if (!book || !book.title || !isReadingNow(st)){ g.visible = false; return; }
  g.visible = true;
  // 读到第几章换一次封面色：翻开新章一眼能看出来
  var hue = 0.055 + (((book.chapter || 0) * 37) % 50) / 360;
  try { g.userData.cover.color.setHSL(hue, 0.42, 0.34); } catch (e) {}
  g.userData.title = book.title;
}

// ── 书房书架：书脊来自《读书》插件的书目 ─────────────────────────────
// 位置是 rooms.json 里 study(x=7,z=2.5) 加上书架在房间局部坐标 (1.85,-2.2)。
// 书名只用来定颜色和厚度，字太小画在书脊上也看不清，所以不写字。
var shelfGroup = null, shelfKey = '';
function buildShelf(books){
  var list = books || [];
  var key = list.map(function (b){ return b.title; }).join('|');
  if (key === shelfKey) return;
  shelfKey = key;
  if (shelfGroup){ scene.remove(shelfGroup); shelfGroup = null; }
  if (!list.length) return;
  var g = new THREE.Group();
  g.position.set(7 + 1.85, 0.07, 2.5 - 2.2);
  var n = Math.min(list.length, 10);
  for (var i = 0; i < n; i++){
    var t = String(list[i].title || '');
    var seed = 0;
    for (var k = 0; k < t.length; k++) seed = (seed * 31 + t.charCodeAt(k)) % 360;
    var mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(seed / 360, 0.45, 0.42),
      roughness: 0.8
    });
    var hh = 0.2 + ((i * 7) % 5) * 0.012;
    var m = new THREE.Mesh(new THREE.BoxGeometry(0.045, hh, 0.2), mat);
    m.position.set(-0.42 + i * 0.075, 0.1 + hh / 2, 0);
    g.add(m);
  }
  scene.add(g);
  shelfGroup = g;
}

function resolveRoom(state){
  if (!state || !state.place) return null;
  var want = String(state.place).trim();
  if (!want) return null;
  var hit = roomIndex.get(want);
  if (hit) return hit;
  for (var i = 0; i < DATA.rooms.length; i++){
    var r = DATA.rooms[i];
    if ((r.aliases || []).indexOf(want) >= 0) return r;
  }
  return null;
}

function placeAvatar(){
  var room = resolveRoom(lastState);
  lastRoom = room;
  avatar.visible = true;
  var p = room ? wpos(room) : { x: DATA.outside.x + GOFF.x, y: 0, z: DATA.outside.z + GOFF.z };
  targetPos.set(p.x, p.y, p.z);
  if (!placed) { avatar.position.copy(targetPos); placed = true; }
}

// ── 读状态 ──────────────────────────────────────────────────────────
async function load(force){
  try {
    var url = '/api/space/state' + (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
    var res = await fetch(url, { cache: 'no-store' });
    if (res.status === 401 || res.status === 403){ warn('缺少或无效的控制台令牌：' + location.pathname + '?token=…'); return; }
    if (!res.ok){ warn('读取状态失败（HTTP ' + res.status + '）'); return; }
    var j = await res.json();

    var first = !DATA.rooms.length;
    if (first){
      DATA.floors = (j.rooms && j.rooms.floors) || [{ id: '1f', label: '一楼' }];
      DATA.rooms = (j.rooms && j.rooms.rooms) || [];
      DATA.outside = (j.rooms && j.rooms.outside) || DATA.outside;
      DATA.scenery = (j.rooms && j.rooms.scenery) || {};
      roomIndex.clear();
      DATA.rooms.forEach(function(r){
        roomIndex.set(r.label, r);
        (r.aliases || []).forEach(function(a){ roomIndex.set(a, r); });
      });
      floorId = (DATA.floors[0] && DATA.floors[0].id) || '1f';
      buildWorld();
      floorId = 'all';
      focusFloor('all', false);
    }

    lastState = j.state || null;
    syncHandBook(j.book, lastState);
    buildShelf(j.books);
    placeAvatar();
    // 放在 placeAvatar 之后：它会把 targetPos 打到房间中心，座位点要把这个覆盖回来
    if (motion) motion.setState(lastState);

    // 她在别的楼层 → 自动跟过去（用户手动切过就不再抢）

    hPlace.textContent = lastState && lastState.place ? lastState.place : '（没有空间状态）';
    hDoing.textContent = ((lastState && (lastState.detail || lastState.doing)) || '—')
      + (j.book && j.book.title ? ' · 手上《' + j.book.title + '》第 ' + ((j.book.chapter || 0) + 1) + '/' + (j.book.chapters || 1) + ' 章' : '');
    hFloor.textContent = lastRoom ? labelOfFloor(lastRoom.floor) : (lastState && lastState.place ? '不在房间表里' : '—');
    renderFloorButtons();
    warn('');
  } catch (e) {
    warn('连不上桥接：' + (e && e.message ? e.message : e));
  }
}

function labelOfFloor(id){
  for (var i = 0; i < DATA.floors.length; i++) if (DATA.floors[i].id === id) return DATA.floors[i].label;
  return id;
}

// ── 渲染循环 ────────────────────────────────────────────────────────
var last = performance.now();
function frame(now){
  var dt = Math.min(0.05, (now - last) / 1000); last = now;

  // 窗口被挡住/最小化时没必要继续烧显卡（--app 全屏窗口特别容易碰到）
  if (document.hidden){ requestAnimationFrame(frame); return; }

  // 阴影节流：最多 10 次/秒。太阳一秒才动一点点，她走路也慢，看不出来。
  if (now - lastShadow > 100){ lastShadow = now; renderer.shadowMap.needsUpdate = true; }

  // 「看她」模式下自动把镜头转回她的正脸（手拖过 4 秒内不抢，否则会跟人抢方向盘）
  if (faceMode && !camTween && !drag && now - lastOrbitDrag > 4000){
    var idealT = Math.PI / 2 + (avatar.rotation.y || 0);
    var dT = ((idealT - orbit.theta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    if (Math.abs(dT) > 0.30){ orbit.theta += dT * Math.min(1, dt * 2.2); applyOrbit(); }
  }

  // 上限 ~65fps：高刷屏上 144Hz 等于白烧一倍显卡，这个场景看不出区别
  if (now - lastRenderAt < 15.0){ requestAnimationFrame(frame); return; }
  lastRenderAt = now;

  // 运镜插值：缓入缓出，角度/视野/注视点一起走，不然会像两个镜头硬接
  if (faceMode){
    // ── 贴脸：摄像机站在她面前，但仍然可以绕着她转 ──────────────────
    // 关键：位置用 orbit.theta / orbit.phi 算（拖动改的就是这两个），
    // 不然镜头会被"焊"在她脸上，鼠标怎么拖都不动。
    var fr = herFrame();
    var hw = new THREE.Vector3();
    (idle.head || avatar).getWorldPosition(hw);

    // 你没动过镜头时，它自己慢慢绕回她正脸；动过就听你的（4 秒内不抢）
    if (!drag && now - lastOrbitDrag > 4000){
      var ideal = Math.PI / 2 + (avatar.rotation.y || 0);
      var dIdeal = ((ideal - orbit.theta + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
      if (Math.abs(dIdeal) > 0.30) orbit.theta += dIdeal * Math.min(1, dt * 1.6);
    }

    faceDist += (faceZoom - faceDist) * (1 - Math.exp(-3.2 * dt));
    var cp = Math.cos(orbit.phi), sp = Math.sin(orbit.phi);
    var bob = Math.sin(now * 0.0016) * 0.010;              // 上下呼吸
    var sway = Math.sin(now * 0.0011) * 0.014;             // 左右轻晃
    camP.position.set(
      hw.x + Math.cos(orbit.theta) * faceDist * cp + sway,
      fr.y + sp * faceDist + bob,
      hw.z + Math.sin(orbit.theta) * faceDist * cp
    );
    camP.lookAt(hw.x, fr.y - 0.035, hw.z);
    camP.updateMatrixWorld();
    activeCam = camP;
    lookAt.set(hw.x, fr.y, hw.z);
  } else if (camTween){
    activeCam = camera;
    camTween.t += dt;
    var k = Math.min(1, camTween.t / camTween.dur);
    var e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    var f = camTween.from, t = camTween.to;
    orbit.theta = f.theta + (t.theta - f.theta) * e;
    orbit.phi = f.phi + (t.phi - f.phi) * e;
    orbit.radius = f.radius + (t.radius - f.radius) * e;
    viewSpan = f.span + (t.span - f.span) * e;
    lookAt.set(f.x + (t.x - f.x) * e, f.y + (t.y - f.y) * e, f.z + (t.z - f.z) * e);
    resize();
    applyOrbit();
    if (k >= 1) camTween = null;
  } else activeCam = camera;

  if (avatar.visible){
    avatar.position.lerp(targetPos, 1 - Math.exp(-5 * dt));

  // 她在看书：书房里书摊在桌面（桌面顶 0.775），别处是捧在胸前
  if (handBook && handBook.visible){
    var byaw = avatar.rotation.y || 0;
    var mode = readingMode(lastState);
    if (mode === 'desk'){
      handBook.position.set(
        avatar.position.x + Math.sin(byaw) * 0.56,
        0.80,
        avatar.position.z + Math.cos(byaw) * 0.56
      );
      handBook.rotation.x = -0.06;
    } else {
      handBook.position.set(
        avatar.position.x + Math.sin(byaw) * 0.20,
        avatar.position.y + 1.06,
        avatar.position.z + Math.cos(byaw) * 0.20
      );
      handBook.rotation.x = -0.55;   // 书立起来一点，对着低头看的角度
    }
    handBook.rotation.y = byaw;
  }
    if (!vrmReady){
      // 占位小人的呼吸；VRM 加载后交给它自己的弹簧骨骼，不再整体缩放（会把模型拉变形）
      var t = now * 0.0011;
      var breath = 1 + Math.sin(t) * 0.009;
      avatar.scale.set(1, breath, 1);
      head.position.y = 0.99 + Math.sin(t) * 0.006;
      hair.position.y = 1.00 + Math.sin(t) * 0.006;
    }
  }
  // VRM 的头发/裙摆物理：每帧推进一次弹簧骨骼，不推进就是一块死的
  if (vrm) {
    // 用实际位移判断她在不在走：比"有没有目标点"准，被卡住时也不会原地踏步
    var mdx = avatar.position.x - prevPos.x;
    var mdz = avatar.position.z - prevPos.z;
    var spd = Math.sqrt(mdx * mdx + mdz * mdz) / Math.max(dt, 0.0001);
    prevPos.copy(avatar.position);
    if (motion) motion.update(dt, now * 0.001, spd);
    else if (spd > 0.25) updateWalk(dt, Math.min(spd, 3.5));
    else updateIdle(now * 0.001);
    // 眼珠跟着当前镜头：她看你，而不是看空气。镜头切换（正交/透视）时也跟着换。
    if (vrm.lookAt) vrm.lookAt.target = activeCam;
    // 眨眼：2.2~5.8 秒一次，一次 0.14 秒（快速闭上、稍慢睁开）。
    // 静止不动的时候，眨眼和视线这两样最像活人，成本几乎为零。
    if (vrm.expressionManager){
      if (blinkPhase < 0){
        blinkWait -= dt;
        if (blinkWait <= 0) blinkPhase = 0;
      } else {
        blinkPhase += dt / 0.14;
        if (blinkPhase >= 1){ blinkPhase = -1; blinkWait = 2.2 + Math.random() * 3.6; }
      }
      var bv = blinkPhase < 0 ? 0 : Math.sin(Math.PI * Math.min(1, blinkPhase));
      vrm.expressionManager.setValue('blink', bv);
    }
    try { vrm.update(dt); } catch (e) {}
  }
  tick(now * 0.001, dt, now);

  // 贴脸时必须压曝光。她的材质是 MToon，**不吃环境光**，直射光 100% 打在脸上；
  // 而白天的 Hemi 0.8 + 太阳 1.3 加起来 2.1 倍，浅肤色直接被夹到纯白 ——
  // 这就是"照她脸上都是白色"。贴脸时整体降 55%，背景也跟着暗，正好是肖像打光。
  var fk = 1 - 0.55 * FOCUS_K;
  sun.intensity = SUN_I * fk;
  amb.intensity = AMB_I * fk;
  rim.intensity = RIM_I * fk;

  renderer.render(scene, activeCam);
  requestAnimationFrame(frame);
}

// ── 交互 ────────────────────────────────────────────────────────────
document.getElementById('bReload').addEventListener('click', function(){
  DATA.rooms = []; roomIndex.clear(); placed = false; autoFollow = true; load(true);
});
document.getElementById('bFace').addEventListener('click', toggleView);
document.getElementById('bDbg').addEventListener('click', dbgToggle);
// F 键切换（页面上没有输入框，不会和打字冲突）
document.addEventListener('keydown', function(e){
  if (e.key === 'f' || e.key === 'F'){ e.preventDefault(); toggleView(); }
});
document.getElementById('bReset').addEventListener('click', function(){ faceMode = false; var fb = document.getElementById('bFace'); if (fb) fb.textContent = '🔍 看她'; autoFollow = false; goFloor('all'); });

// 拖拽转视角（维护角度状态，不反算；上下限夹住而不是丢增量）
var drag = null;
function endDrag(){ drag = null; }
renderer.domElement.addEventListener('pointerdown', function(e){
  drag = { x: e.clientX, y: e.clientY };
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (err) {}
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(ev){
  renderer.domElement.addEventListener(ev, endDrag);
});
window.addEventListener('blur', endDrag);   // 切窗口/丢焦点时别留着 drag，否则回来一动就跳
renderer.domElement.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = (e.clientX - drag.x) * 0.0055, dy = (e.clientY - drag.y) * 0.0055;
  drag.x = e.clientX; drag.y = e.clientY;
  lastOrbitDrag = performance.now();
  orbit.theta -= dx;
  orbit.phi = Math.max(PHI_MIN, Math.min(PHI_MAX, orbit.phi + dy));
  applyOrbit();
});
// 滚轮：远景改正交视野宽度；贴脸时改她到镜头的距离（0.35~1.8 米）
renderer.domElement.addEventListener('wheel', function(e){
  e.preventDefault();
  var factor = e.deltaY > 0 ? 1.08 : 1 / 1.08;
  if (faceMode){
    faceZoom = Math.max(0.35, Math.min(1.8, faceZoom * factor));
  } else {
    viewSpan = Math.max(3, Math.min(80, viewSpan * factor));
    resize();
  }
  lastOrbitDrag = performance.now();
}, { passive: false });

// ── 每帧的小动静：树梢摇、蝴蝶飞、海浪涌、海鸥盘旋、灯在夜里亮起 ───────
function tick(t, dt, now){
  var i, o;
  timeStep(dt); updateUpper(dt); updateFocus(dt, now); poolUpdate(dt, t);
  herLight.intensity = FOCUS_K * (0.12 + 0.30 * TM.n);
  for (i = 0; i < SWAY.length; i++){
    o = SWAY[i];
    if (o.breath) o.o.scale.y = 1 + Math.sin(t * 1.4) * 0.025;
    else { o.o.rotation.z = Math.sin(t * 0.9 + o.ph) * 0.022; o.o.rotation.x = Math.cos(t * 0.7 + o.ph) * 0.016; }
  }
  for (i = 0; i < BFLY.length; i++){
    o = BFLY[i]; var a = t * o.sp + o.ph;
    o.o.position.set(o.cx + Math.cos(a) * o.r, 0.75 + Math.sin(t * 2 + o.ph) * 0.18, o.cz + Math.sin(a) * o.r * 0.7);
    o.o.rotation.y = -a;
    var fl = Math.sin(t * 16 + o.ph) * 0.9; o.w1.rotation.y = fl; o.w2.rotation.y = -fl;
    o.o.visible = TM.n < 0.8;
  }
  for (i = 0; i < WAVES.length; i++){
    o = WAVES[i];
    if (o.bob) o.o.position.y = 0.1 + Math.sin(t * 1.3 + o.ph) * 0.014;
    else o.o.position.x = 7 + o.side + Math.sin(t * 0.25 + o.ph) * 3.2;
  }
  if (SEA){
    M.sea.map.offset.set(t * 0.004, t * 0.0025);
    SEA.rt.offset.set(-t * 0.009, t * 0.006);
    SEA.st.offset.set(t * 0.005, -t * 0.003);
    SEA.ripple.opacity = (0.5 - 0.22 * TM.n) * (0.85 + Math.sin(t * 0.8) * 0.15);
    for (i = 0; i < SHORE.length; i++){
      o = SHORE[i];
      var p = (t * 0.1 + o.ph) % 1;
      o.o.position.z = -4.85 - (1 - p) * 5.5;
      o.m.opacity = 0.6 * Math.sin(Math.PI * Math.pow(p, 0.7)) * (1 - 0.45 * TM.n);
    }
    for (i = 0; i < GULLS.length; i++){
      o = GULLS[i]; var ga = t * o.sp + o.ph;
      o.o.position.set(o.cx + Math.cos(ga) * o.r, o.y + Math.sin(t * 0.9 + o.ph) * 0.3, o.cz + Math.sin(ga) * o.r * 0.6);
      o.o.rotation.y = -ga + Math.PI / 2;
      o.w1.rotation.z = Math.sin(t * 5 + o.ph) * 0.45; o.w2.rotation.z = -Math.sin(t * 5 + o.ph) * 0.45;
      o.o.visible = TM.n < 0.7;
    }
  }
  if (M.water.map) M.water.map.offset.x = t * 0.012;
}

// ── 点房间聚焦、悬停高亮 ─────────────────────────────────────────────
var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hover = null, down = null;
function pickRoom(e){
  var r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, activeCam);
  var hits = ray.intersectObjects(PICKS, false);
  for (var i = 0; i < hits.length; i++){
    var rm = hits[i].object.userData.room;
    if (rm && rm.floor === '2f' && UKc < 0.5) continue;
    return hits[i].object;
  }
  return null;
}
function setHover(f){
  if (f === hover) return;
  if (hover && hover.material) hover.material.emissiveIntensity = 0;
  hover = f;
  if (hover && hover.material) hover.material.emissiveIntensity = 0.28;
  renderer.domElement.style.cursor = hover ? 'pointer' : '';
}
function focusRoom(r){
  faceMode = false;
  var fb = document.getElementById('bFace'); if (fb) fb.textContent = '🔍 看她';
  setWallsFaded(false);
  floorId = r.floor; autoFollow = false; renderFloorButtons();
  var p = wpos(r), span = Math.max(r.w, r.d);
  startTween({ theta: Math.PI * 0.25, phi: 0.85, radius: span * 1.5, span: span * 1.6 + 1.6, x: p.x, y: p.y + 0.4, z: p.z }, 1.1);
}
renderer.domElement.addEventListener('pointermove', function (e){ if (!drag) setHover(pickRoom(e)); });
renderer.domElement.addEventListener('pointerleave', function (){ setHover(null); });
renderer.domElement.addEventListener('pointerdown', function (e){ down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', function (e){
  if (!down) return;
  var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dtm = performance.now() - down.t;
  down = null;
  if (moved > 5 || dtm > 450) return;
  var f = pickRoom(e);
  if (f && f.userData.room) focusRoom(f.userData.room);
});

function cycleTime(){
  var i = TIME_MODES.indexOf(TM.mode);
  TM.mode = TIME_MODES[(i + 1) % TIME_MODES.length];
  document.getElementById('bMood').textContent = TIME_LABEL[TM.mode];
}
document.getElementById('bMood').textContent = TIME_LABEL[TM.mode] || '🕒 实时';
document.getElementById('bMood').addEventListener('click', cycleTime);
document.addEventListener('keydown', function (e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 't' || e.key === 'T') cycleTime();
  var VIEWS = ['all'].concat(DATA.floors.map(function (f){ return f.id; }));
  var idx = '1234'.indexOf(e.key);
  if (idx >= 0 && VIEWS[idx]){ autoFollow = false; goFloor(VIEWS[idx]); }
});


resize();
setTimeout(function (){ app.classList.add('in'); }, 60);
load(true);
loadModel();
setInterval(function(){ load(false); }, 3000);
requestAnimationFrame(frame);
</script>
